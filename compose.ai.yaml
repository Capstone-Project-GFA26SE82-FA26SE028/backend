services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NO_CLOUD: 'true'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - ai-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
  ai-model-init:
    image: backend-ai:local
    build:
      context: .
      dockerfile: Services/ai_service/AI.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    command: ['--prepare-model']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'
    networks:
      - backend
  ai:
    image: backend-ai:local
    build:
      context: .
      dockerfile: Services/ai_service/AI.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      ai-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'dotnet', 'AI.API.dll', '--check-ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - backend
  gateway:
    environment:
      GrpcServices__AI: http://ai:5008
volumes:
  ai-models:

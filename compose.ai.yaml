services:
  ai:
    image: backend-ai:local
    build:
      context: .
      dockerfile: Services/ai_service/AI.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ['CMD', 'dotnet', 'AI.API.dll', '--check-ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend
  gateway:
    environment:
      GrpcServices__AI: http://ai:5008

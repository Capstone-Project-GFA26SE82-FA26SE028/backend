syntax = "proto3";

message GuestJoinRequest {
  string table_session_id = 1;
  string phone_or_code = 2;
}

message GuestAccessRequest {
  string table_session_id = 1;
  string token = 2;
}

message GuestAccessReply {
  string table_session_id = 1;
  string expires_at = 2;
  string token = 3;
  string guest_access_id = 4;
}

service GuestAccessGrpc {
  rpc Join(GuestJoinRequest) returns (GuestAccessReply);
  rpc GetMe(GuestAccessRequest) returns (GuestAccessReply);
}

service BillingSessionGrpc {
  rpc GetById(BillingSessionRequest) returns (BillingSessionReply);
}
message BillingSessionRequest { string table_session_id = 1; }
message BillingSessionReply { string table_session_id = 1; string restaurant_id = 2; }

service RestaurantAccessGrpc {
  rpc GetCurrentScope(CurrentRestaurantScopeRequest) returns (CurrentRestaurantScopeReply);
}

message CurrentRestaurantScopeRequest {
  optional string restaurant_id = 1;
}

message CurrentRestaurantScopeReply {
  string user_id = 1;
  string role_id = 2;
  bool is_administrator = 3;
  repeated string restaurant_ids = 4;
}
option csharp_namespace = "Backend.Contracts.Restaurant";
package restaurant;

service ServiceRequestGrpc {
  rpc Create(PaymentServiceRequest) returns (ServiceRequestInfo);
  rpc GetById(PaymentServiceRequest) returns (ServiceRequestInfo);
  rpc GetAll(ServiceRequestListRequest) returns (ServiceRequestPage);
  rpc Acknowledge(PaymentServiceRequest) returns (ServiceRequestInfo);
  rpc Review(PaymentServiceRequest) returns (ServiceRequestInfo);
  rpc Cancel(PaymentServiceRequest) returns (ServiceRequestInfo);
}

message PaymentServiceRequest {
  string table_session_id = 1;
  string service_request_id = 2;
  string guest_token = 3;
}

message ServiceRequestListRequest {
  string restaurant_id = 1;
  optional string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ServiceRequestInfo {
  string service_request_id = 1;
  string table_session_id = 2;
  string restaurant_id = 3;
  string type = 4;
  string status = 5;
  string requested_at = 6;
  optional string acknowledged_at = 7;
  optional string completed_at = 8;
  optional string handled_by_ref = 9;
}

message ServiceRequestPage {
  repeated ServiceRequestInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
import "google/protobuf/empty.proto";

message IdRequest { string id = 1; string version = 2; }
message ListRequest {
  optional string restaurant_id = 1;
  optional string area_id = 2;
  optional bool is_active = 3;
  string search = 4;
  int32 page = 5;
  int32 page_size = 6;
}
message StatusRequest { string id = 1; bool is_active = 2; string version = 3; }
message AssignAreaRequest { string id = 1; string area_id = 2; string version = 3; }
message OpeningHourInfo { int32 day_of_week = 1; string open_at = 2; string close_at = 3; }

message RestaurantInfo {
  string restaurant_id = 1;
  string restaurant_name = 2;
  string address = 3;
  string hotline = 4;
  optional string tax_code = 5;
  optional string logo_url = 6;
  string time_zone = 7;
  repeated OpeningHourInfo opening_hours = 8;
}
message RestaurantPage { repeated RestaurantInfo items = 1; int32 total_count = 2; int32 page = 3; int32 page_size = 4; }
service RestaurantGrpc {
  rpc GetAll(ListRequest) returns (RestaurantPage);
  rpc GetById(IdRequest) returns (RestaurantInfo);
  rpc Create(RestaurantInfo) returns (RestaurantInfo);
  rpc Update(RestaurantInfo) returns (RestaurantInfo);
}

message AreaInfo {
  string area_id = 1;
  string restaurant_id = 2;
  string area_code = 3;
  string area_name = 4;
  string service_type = 5;
  string space_type = 6;
  bool is_active = 7;
}
message AreaPage { repeated AreaInfo items = 1; int32 total_count = 2; int32 page = 3; int32 page_size = 4; }
service AreaGrpc {
  rpc GetAll(ListRequest) returns (AreaPage);
  rpc GetById(IdRequest) returns (AreaInfo);
  rpc Create(AreaInfo) returns (AreaInfo);
  rpc Update(AreaInfo) returns (AreaInfo);
  rpc Delete(IdRequest) returns (google.protobuf.Empty);
  rpc SetStatus(StatusRequest) returns (AreaInfo);
}

message TableInfo {
  string table_id = 1;
  string area_id = 2;
  string table_code = 3;
  int32 capacity = 4;
  optional string position_x = 5;
  optional string position_y = 6;
  bool is_active = 7;
  string cleaning_status = 8;
  string version = 9;
}
message TablePage { repeated TableInfo items = 1; int32 total_count = 2; int32 page = 3; int32 page_size = 4; }
message ServiceTableInfo {
  string table_id = 1;
  string table_code = 2;
  string area_id = 3;
  string area_name = 4;
  string restaurant_id = 5;
  string cleaning_status = 6;
  repeated string open_session_ids = 7;
  string version = 8;
}
message ServiceTablePage { repeated ServiceTableInfo items = 1; int32 total_count = 2; int32 page = 3; int32 page_size = 4; }
service TableGrpc {
  rpc ConfirmClean(IdRequest) returns (TableInfo);
  rpc GetServiceTables(ListRequest) returns (ServiceTablePage);
  rpc GetAll(ListRequest) returns (TablePage);
  rpc GetById(IdRequest) returns (TableInfo);
  rpc Create(TableInfo) returns (TableInfo);
  rpc Update(TableInfo) returns (TableInfo);
  rpc Delete(IdRequest) returns (google.protobuf.Empty);
  rpc SetStatus(StatusRequest) returns (TableInfo);
  rpc AssignArea(AssignAreaRequest) returns (TableInfo);
}

message QrRegenerateRequest { string table_id = 1; string expected_qr_id = 2; }
message QrTokenRequest { string token = 1; }
message QrInfo {
  string qr_id = 1;
  string table_id = 2;
  string table_code = 3;
  string area_id = 4;
  string created_at = 5;
  optional string revoked_at = 6;
  bool is_usable = 7;
  optional string image_url = 8;
}
message QrImageReply { bytes png = 1; }
message QrCreatedReply { QrInfo qr = 1; string menu_url = 2; string token = 3; bytes png = 4; }
message QrPage { repeated QrInfo items = 1; int32 total_count = 2; int32 page = 3; int32 page_size = 4; }
message QrTableReply { string table_id = 1; string table_code = 2; string area_id = 3; string restaurant_id = 4; }
service QrGrpc {
  rpc GetImage(IdRequest) returns (QrImageReply);
  rpc GetAll(ListRequest) returns (QrPage);
  rpc Create(IdRequest) returns (QrCreatedReply);
  rpc Regenerate(QrRegenerateRequest) returns (QrCreatedReply);
  rpc Resolve(QrTokenRequest) returns (QrTableReply);
}

message TableSessionScanReply {
  string table_session_id = 1;
  string table_id = 2;
  string table_code = 3;
  string area_id = 4;
  string restaurant_id = 5;
  string status = 6;
  string opened_at = 7;
  bool is_new_session = 8;
}
service TableSessionGrpc {
  rpc Depart(IdRequest) returns (TableSessionDepartureReply);
  rpc OpenForWaiter(IdRequest) returns (TableSessionScanReply);
  rpc Scan(QrTokenRequest) returns (TableSessionScanReply);
  rpc GetForOrdering(OrderSessionRequest) returns (OrderSessionReply);
}

message TableSessionDepartureReply {
  string table_session_id = 1;
  string restaurant_id = 2;
  string status = 3;
  string closed_at = 4;
  repeated string table_ids = 5;
}

message OrderSessionRequest {
  string table_session_id = 1;
  optional string table_id = 2;
  string guest_token = 3;
}
message OrderSessionReply {
  string table_session_id = 1;
  optional string table_id = 2;
  optional string user_id = 3;
  optional string guest_access_id = 4;
  optional string expires_at = 5;
}


service ReservationGrpc {
  rpc Reject(ReservationIdRequest) returns (ReservationInfo);
  rpc Confirm(ConfirmReservationRequest) returns (ReservationInfo);
  rpc CheckIn(ReservationIdRequest) returns (ReservationInfo);
  rpc Cancel(ReservationIdRequest) returns (ReservationInfo);
  rpc Update(UpdateReservationRequest) returns (ReservationInfo);
  rpc Create(CreateReservationRequest) returns (ReservationInfo);
  rpc GetAll(ReservationListRequest) returns (ReservationPage);
  rpc GetById(ReservationIdRequest) returns (ReservationInfo);
  rpc GetAvailability(ReservationAvailabilityRequest) returns (ReservationAvailabilityReply);
}

message CreateReservationRequest {
  string restaurant_id = 1;
  string requested_area_id = 2;
  string contact_name = 3;
  string phone = 4;
  int32 party_size = 5;
  string start_at = 6;
}

message ReservationIdRequest {
  string reservation_id = 1;
}

message ReservationListRequest {
  optional string assigned_restaurant_id = 1;
  optional string assigned_area_id = 2;
  bool unassigned_only = 3;
  optional string status = 4;
  optional string from = 5;
  optional string to = 6;
  int32 page = 7;
  int32 page_size = 8;
  optional string restaurant_id = 9;
  optional string requested_area_id = 10;
}

message ReservationInfo {
  string reservation_id = 1;
  string contact_name = 2;
  string phone = 3;
  int32 party_size = 4;
  string start_at = 5;
  string end_at = 6;
  optional string hold_until = 7;
  string status = 8;
  optional string approved_by_ref = 9;
  optional string assigned_restaurant_id = 10;
  optional string assigned_area_id = 11;
  bool has_consistent_assignment = 12;
  optional string table_session_id = 13;
  repeated string assigned_table_ids = 14;
  string restaurant_id = 15;
  string requested_area_id = 16;
  optional string confirmed_at = 17;
  optional string cancelled_at = 18;
  optional string cancelled_by_ref = 19;
}

message ReservationPage {
  repeated ReservationInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ReservationAvailabilityRequest {
  string restaurant_id = 1;
  string area_id = 2;
  int32 party_size = 3;
  string start_at = 4;
}

message ReservationTableAvailabilityInfo {
  string table_id = 1;
  string table_code = 2;
  int32 capacity = 3;
  string cleaning_status = 4;
  bool is_schedule_available = 5;
  repeated string reasons = 6;
}

message ReservationAvailabilityReply {
  string restaurant_id = 1;
  string area_id = 2;
  int32 party_size = 3;
  string evaluated_at = 4;
  string start_at = 5;
  string end_at = 6;
  string hold_starts_at = 7;
  string hold_until = 8;
  string blocked_until = 9;
  int32 available_capacity = 10;
  bool has_enough_capacity = 11;
  bool requires_staff_layout_review = 12;
  repeated string reasons = 13;
  repeated ReservationTableAvailabilityInfo tables = 14;
}


message ConfirmReservationRequest {
  string reservation_id = 1;
  repeated string table_ids = 2;
}

message UpdateReservationRequest {
  string reservation_id = 1;
  string start_at = 2;
  repeated string table_ids = 3;
}

service RestaurantStaffGrpc {
  rpc Create(RestaurantStaffRequest) returns (RestaurantStaffInfo);
  rpc GetAll(RestaurantStaffListRequest) returns (RestaurantStaffListReply);
  rpc Delete(RestaurantStaffRequest) returns (RestaurantStaffInfo);
}

message RestaurantStaffRequest {
  string restaurant_id = 1;
  string user_id_ref = 2;
}

message RestaurantStaffListRequest {
  string restaurant_id = 1;
}

message RestaurantStaffInfo {
  string restaurant_id = 1;
  string user_id_ref = 2;
  bool is_active = 3;
}

message RestaurantStaffListReply {
  repeated RestaurantStaffInfo items = 1;
}

syntax = "proto3";

option csharp_namespace = "Backend.Contracts.Catalog";

package catalog;

service CategoryGrpc {
  rpc Create (CreateCategoryRequest) returns (CategoryReply);
  rpc GetAll (CategoryListRequest) returns (CategoryListReply);
  rpc GetById (CategoryIdRequest) returns (CategoryReply);
  rpc Update (UpdateCategoryRequest) returns (CategoryReply);
  rpc SetStatus (SetCategoryStatusRequest) returns (CategoryReply);
  rpc Delete (CategoryIdRequest) returns (CategoryReply);
}

message CreateCategoryRequest {
  string category_name = 1;
}

message UpdateCategoryRequest {
  string category_id = 1;
  string category_name = 2;
}

message SetCategoryStatusRequest {
  string category_id = 1;
  optional bool is_active = 2;
}

message CategoryIdRequest {
  string category_id = 1;
}

message CategoryListRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string search = 3;
  optional bool is_active = 4;
}

message CategoryInfo {
  string category_id = 1;
  string category_code = 2;
  string category_name = 3;
  bool is_active = 4;
}

message CategoryReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  CategoryInfo result = 4;
}

message CategoryListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated CategoryInfo items = 4;
  int32 total_count = 5;
  int32 page = 6;
  int32 page_size = 7;
}

service ItemGrpc {
  rpc Create (CreateItemRequest) returns (ItemReply);
  rpc GetAll (ItemListRequest) returns (ItemListReply);
  rpc GetById (ItemIdRequest) returns (ItemReply);
  rpc Update (UpdateItemRequest) returns (ItemReply);
  rpc SetStatus (SetItemStatusRequest) returns (ItemReply);
}

message SetItemStatusRequest {
  string item_id = 1;
  string availability = 2;
  string version = 3;
}

message CreateItemRequest {
  string category_id = 1;
  string item_name = 2;
  optional string description = 3;
  optional string image_url = 4;
}

message UpdateItemRequest {
  string item_id = 1;
  string category_id = 2;
  string item_name = 3;
  optional string description = 4;
  optional string image_url = 5;
  string version = 6;
}

message ItemIdRequest {
  string item_id = 1;
}

message ItemListRequest {
  optional string category_id = 1;
  optional string search = 2;
  optional string availability = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ItemInfo {
  string item_id = 1;
  string category_id = 2;
  string category_name = 3;
  string item_code = 4;
  string item_name = 5;
  optional string description = 6;
  optional string image_url = 7;
  string availability = 8;
  string version = 9;
}

message ItemReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  ItemInfo result = 4;
}

message ItemListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated ItemInfo items = 4;
  int32 total_count = 5;
  int32 page = 6;
  int32 page_size = 7;
}

service PriceGrpc {
  rpc Create (CreatePriceRequest) returns (PriceReply);
  rpc GetAll (PriceListRequest) returns (PriceListReply);
  rpc GetById (PriceIdRequest) returns (PriceReply);
  rpc Update (UpdatePriceRequest) returns (PriceReply);
  rpc Delete (DeletePriceRequest) returns (PriceReply);
  rpc Replace (ReplacePriceRequest) returns (PriceReply);
  rpc GetAppliedPrice (AppliedPriceRequest) returns (AppliedPriceReply);
}

message PriceIdRequest {
  string price_id = 1;
}

message CreatePriceRequest {
  string item_id = 1;
  string channel = 2;
  string amount = 3;
  string effective_from = 4;
  optional string effective_to = 5;
  optional string daily_start = 6;
  optional string daily_end = 7;
}

message UpdatePriceRequest {
  string price_id = 1;
  string channel = 2;
  string amount = 3;
  string effective_from = 4;
  optional string effective_to = 5;
  optional string daily_start = 6;
  optional string daily_end = 7;
  reserved 8;
  reserved "expected_token";
}

message ReplacePriceRequest {
  string price_id = 1;
  string amount = 2;
  optional string effective_to = 3;
  reserved 4;
  reserved "expected_token";
}

message DeletePriceRequest {
  string price_id = 1;
  reserved 2;
  reserved "expected_token";
}

message PriceListRequest {
  optional string item_id = 1;
  optional string channel = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message PriceInfo {
  string price_id = 1;
  string item_id = 2;
  string channel = 3;
  string amount = 4;
  string effective_from = 5;
  optional string effective_to = 6;
  optional string daily_start = 7;
  optional string daily_end = 8;
  reserved 9;
  reserved "concurrency_token";
}

message PriceReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  PriceInfo result = 4;
}

message PriceListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated PriceInfo items = 4;
  int32 total_count = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message AppliedPriceRequest {
  string item_id = 1;
  string channel = 2;
  optional string at = 3;
}

message AppliedPriceInfo {
  string item_id = 1;
  string price_id = 2;
  string amount = 3;
  string requested_channel = 4;
  string price_channel = 5;
  string evaluated_at = 6;
  bool has_valid_standard_price = 7;
  PriceInfo price = 8;
}

message AppliedPriceReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  AppliedPriceInfo result = 4;
}

service OptionGroupGrpc {
  rpc Create (CreateOptionGroupRequest) returns (OptionGroupReply);
  rpc GetAll (OptionGroupListRequest) returns (OptionGroupListReply);
  rpc GetById (OptionGroupIdRequest) returns (OptionGroupReply);
  rpc Update (UpdateOptionGroupRequest) returns (OptionGroupReply);
  rpc Delete (OptionGroupIdRequest) returns (OptionGroupReply);
}

message CreateOptionGroupRequest {
  string option_group_name = 1;
}

message UpdateOptionGroupRequest {
  string option_group_id = 1;
  string option_group_name = 2;
}

message OptionGroupIdRequest {
  string option_group_id = 1;
}

message OptionGroupListRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string search = 3;
}

message OptionGroupInfo {
  string option_group_id = 1;
  string option_group_name = 2;
}

message OptionGroupReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  OptionGroupInfo result = 4;
}

message OptionGroupListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated OptionGroupInfo items = 4;
  int32 total_count = 5;
  int32 page = 6;
  int32 page_size = 7;
}

service OptionGrpc {
  rpc Create (CreateOptionRequest) returns (OptionReply);
  rpc GetAll (OptionListRequest) returns (OptionListReply);
  rpc GetById (OptionIdRequest) returns (OptionReply);
  rpc Update (UpdateOptionRequest) returns (OptionReply);
  rpc SetStatus (SetOptionStatusRequest) returns (OptionReply);
  rpc Delete (OptionIdRequest) returns (OptionReply);
}

message CreateOptionRequest {
  string option_group_id = 1;
  string option_name = 2;
  string extra_price = 3;
}

message UpdateOptionRequest {
  string option_id = 1;
  string option_name = 2;
  string extra_price = 3;
}

message SetOptionStatusRequest {
  string option_id = 1;
  string availability = 2;
}

message OptionIdRequest {
  string option_id = 1;
}

message OptionListRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string search = 3;
  optional string option_group_id = 4;
  optional string availability = 5;
}

message OptionInfo {
  string option_id = 1;
  string option_group_id = 2;
  string option_name = 3;
  string extra_price = 4;
  string availability = 5;
}

message OptionReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  OptionInfo result = 4;
}

message OptionListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated OptionInfo items = 4;
  int32 total_count = 5;
  int32 page = 6;
  int32 page_size = 7;
}

service ItemOptionGroupGrpc {
  rpc Create (CreateItemOptionGroupRequest) returns (ItemOptionGroupReply);
  rpc GetAll (ItemOptionGroupListRequest) returns (ItemOptionGroupListReply);
  rpc GetById (ItemOptionGroupIdRequest) returns (ItemOptionGroupReply);
  rpc Update (UpdateItemOptionGroupRequest) returns (ItemOptionGroupReply);
  rpc Delete (ItemOptionGroupIdRequest) returns (ItemOptionGroupReply);
}

message CreateItemOptionGroupRequest {
  string item_id = 1;
  string option_group_id = 2;
  optional int32 min_selection = 3;
  optional int32 max_selection = 4;
}

message UpdateItemOptionGroupRequest {
  string item_id = 1;
  string option_group_id = 2;
  optional int32 min_selection = 3;
  optional int32 max_selection = 4;
}

message ItemOptionGroupIdRequest {
  string item_id = 1;
  string option_group_id = 2;
}

message ItemOptionGroupListRequest {
  string item_id = 1;
}

message ItemOptionGroupInfo {
  string item_id = 1;
  string option_group_id = 2;
  string option_group_name = 3;
  int32 min_selection = 4;
  int32 max_selection = 5;
}

message ItemOptionGroupReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  ItemOptionGroupInfo result = 4;
}

message ItemOptionGroupListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated ItemOptionGroupInfo items = 4;
}

service RecipeGrpc {
  rpc CreateItemRecipe (CreateItemRecipeRequest) returns (RecipeReply);
  rpc GetActiveItemRecipe (ActiveItemRecipeRequest) returns (RecipeReply);
  rpc GetItemRecipeHistory (ItemRecipeHistoryRequest) returns (RecipeListReply);
  rpc CreateOptionRecipe (CreateOptionRecipeRequest) returns (RecipeReply);
  rpc GetActiveOptionRecipe (ActiveOptionRecipeRequest) returns (RecipeReply);
  rpc GetOptionRecipeHistory (OptionRecipeHistoryRequest) returns (RecipeListReply);
  rpc GetRecipeById (RecipeIdRequest) returns (RecipeReply);
}

message CreateRecipeIngredientRequest {
  string ingredient_ref = 1;
  string unit_ref = 2;
  string quantity = 3;
  string conversion_factor = 4;
}

message CreateRecipeMediaRequest {
  string media_type = 1;
  string url = 2;
  int32 display_order = 3;
}

message CreateItemRecipeRequest {
  string item_id = 1;
  optional string effective_from = 2;
  optional string instructions = 3;
  repeated CreateRecipeIngredientRequest ingredients = 4;
  repeated CreateRecipeMediaRequest media = 5;
}

message ActiveItemRecipeRequest {
  string item_id = 1;
  optional string at = 2;
}

message ItemRecipeHistoryRequest {
  string item_id = 1;
}

message CreateOptionRecipeRequest {
  string option_id = 1;
  optional string effective_from = 2;
  optional string instructions = 3;
  repeated CreateRecipeIngredientRequest ingredients = 4;
  repeated CreateRecipeMediaRequest media = 5;
}

message ActiveOptionRecipeRequest {
  string option_id = 1;
  optional string at = 2;
}

message OptionRecipeHistoryRequest {
  string option_id = 1;
}

message RecipeIdRequest {
  string recipe_version_id = 1;
}

message RecipeIngredientInfo {
  string recipe_ingredient_id = 1;
  string recipe_version_id = 2;
  string ingredient_ref = 3;
  string unit_ref = 4;
  string quantity = 5;
  string base_quantity_snapshot = 6;
  string conversion_factor_snapshot = 7;
}

message RecipeMediaInfo {
  string recipe_media_id = 1;
  string recipe_version_id = 2;
  string media_type = 3;
  string url = 4;
  int32 display_order = 5;
}

message RecipeInfo {
  string recipe_version_id = 1;
  optional string item_id = 2;
  optional string option_id = 3;
  int32 version = 4;
  string effective_from = 5;
  optional string effective_to = 6;
  optional string instructions = 7;
  repeated RecipeIngredientInfo ingredients = 8;
  repeated RecipeMediaInfo media = 9;
}

message RecipeReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  RecipeInfo result = 4;
}

message RecipeListReply {
  int32 status_code = 1;
  string message = 2;
  bool is_success = 3;
  repeated RecipeInfo items = 4;
}

syntax = "proto3";

option csharp_namespace = "Backend.Contracts.Billing";
package billing;

service TaxFeePolicyGrpc {
  rpc Create(CreateTaxFeePolicyRequest) returns (TaxFeePolicyInfo);
  rpc GetAll(TaxFeePolicyListRequest) returns (TaxFeePolicyPage);
  rpc GetById(TaxFeePolicyIdRequest) returns (TaxFeePolicyInfo);
}

message CreateTaxFeePolicyRequest {
  optional string vat_rate = 1;
  optional string service_rate = 2;
  optional bool service_enabled = 3;
  optional string effective_from = 4;
}

message TaxFeePolicyIdRequest { string tax_fee_policy_id = 1; }
message TaxFeePolicyListRequest { int32 page = 1; int32 page_size = 2; }
message TaxFeePolicyInfo {
  string tax_fee_policy_id = 1;
  int32 version = 2;
  string vat_rate = 3;
  string service_rate = 4;
  bool service_enabled = 5;
  string effective_from = 6;
}

message TaxFeePolicyPage {
  repeated TaxFeePolicyInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service CashRegisterGrpc {
  rpc Create(CreateCashRegisterRequest) returns (CashRegisterInfo);
  rpc GetAll(CashRegisterListRequest) returns (CashRegisterPage);
  rpc GetById(CashRegisterIdRequest) returns (CashRegisterInfo);
}

service CashShiftGrpc {
  rpc Open(OpenCashShiftRequest) returns (CashShiftInfo);
  rpc GetCurrent(CashShiftRegisterRequest) returns (CashShiftInfo);
}

message CashShiftRegisterRequest {
  string cash_register_id = 1;
}

message OpenCashShiftRequest {
  string cash_register_id = 1;
  optional string opening_cash = 2;
}

message CashShiftInfo {
  string cash_shift_id = 1;
  string cash_register_id = 2;
  string restaurant_id = 3;
  string cashier_user_ref = 4;
  string opening_cash = 5;
  string opened_at = 6;
  string status = 7;
}

message CreateCashRegisterRequest {
  string restaurant_id = 1;
  string code = 2;
}

message CashRegisterListRequest {
  optional string restaurant_id = 1;
  optional string search = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CashRegisterIdRequest {
  string cash_register_id = 1;
}

message CashRegisterInfo {
  string cash_register_id = 1;
  string restaurant_id = 2;
  string code = 3;
}

message CashRegisterPage {
  repeated CashRegisterInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service BillGrpc {
  rpc Create(CreateBillRequest) returns (BillInfo);
  rpc GetAll(BillListRequest) returns (BillPage);
  rpc GetById(BillIdRequest) returns (BillInfo);
}
message CreateBillRequest { string table_session_id = 1; }
message BillIdRequest { string bill_id = 1; }
message BillListRequest {
  optional string restaurant_id = 1;
  optional string search = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message BillInfo {
  string bill_id = 1;
  string restaurant_id = 2;
  string bill_number = 3;
  string status = 4;
  string currency = 5;
  string sub_total = 6;
  string discount_amount = 7;
  string vat_rate_snapshot = 8;
  string service_rate_snapshot = 9;
  string vat_amount = 10;
  string service_amount = 11;
  string total_amount = 12;
  string rounding_adjustment = 13;
  string version = 14;
  bool has_complete_cogs = 15;
  string source_status = 16;
  repeated string warnings = 17;
  repeated BillLineInfo items = 18;
}
message BillLineInfo {
  string bill_line_id = 1;
  string order_item_ref = 2;
  string table_session_ref = 3;
  string original_table_ref = 4;
  optional string combo_group_ref = 5;
  string item_snapshot_json = 6;
  string quantity = 7;
  string unit_price_snapshot = 8;
  optional string cogs_snapshot = 9;
  string line_total = 10;
}
message BillPage {
  repeated BillInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

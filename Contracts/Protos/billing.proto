syntax = "proto3";

option csharp_namespace = "Backend.Contracts.Billing";
package billing;

service PaymentSettlementGrpc {
  rpc GetVerifiedCheckout(VerifiedCheckoutRequest) returns (VerifiedCheckoutReply);
}

message VerifiedCheckoutRequest {
  string restaurant_id = 1;
  string table_session_id = 2;
}

message VerifiedCheckoutReply {
  optional string checkout_id = 1;
}
import "google/protobuf/empty.proto";
service PaymentGrpc {
  rpc PayCash(PayCashRequest) returns (CashPaymentReply);
  rpc GetById(PaymentIdRequest) returns (PaymentInfo);
}
message PayCashRequest {
  string bill_id = 1;
  string checkout_id = 2;
  string cash_shift_id = 3;
  optional string cash_received = 4;
  string idempotency_key = 5;
}
message PaymentIdRequest { string payment_id = 1; }
message CashPaymentReply { PaymentInfo payment = 1; bool created = 2; }
message PaymentInfo {
  string payment_id = 1;
  string bill_id = 2;
  string bill_number = 3;
  string restaurant_id = 4;
  string checkout_id = 5;
  string cash_shift_id = 6;
  string cash_register_id = 7;
  string method_code = 8;
  string status = 9;
  string currency = 10;
  string amount = 11;
  string cash_received = 12;
  string change_amount = 13;
  string confirmed_by_ref = 14;
  string paid_at = 15;
  string cash_movement_id = 16;
}
service PaymentSubmissionGrpc {
  rpc Submit(SubmitPaymentRequest) returns (PaymentSubmissionInfo);
  rpc GetIncoming(PaymentSubmissionListRequest) returns (PaymentSubmissionPage);
  rpc GetPaid(PaymentSubmissionListRequest) returns (PaymentSubmissionPage);
}

message SubmitPaymentRequest {
  string table_session_id = 1;
  string service_request_id = 2;
}

message PaymentSubmissionListRequest {
  string restaurant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  optional string search = 4;
  optional string area_id = 5;
  optional string cash_shift_id = 6;
}

message PaymentSubmissionInfo {
  optional string checkout_id = 1;
  string table_session_id = 2;
  string cash_register_id = 3;
  optional string submitted_at = 4;
  string status = 5;
  optional string bill_id = 6;
  optional string bill_code = 7;
  optional string total_amount = 8;
  repeated CashierTableInfo tables = 9;
  optional string table_id = 10;
  optional string table_code = 11;
  optional string area_id = 12;
  optional string area_name = 13;
  int32 party_size = 14;
  optional string opened_at = 15;
  optional string paid_at = 16;
}

message CashierTableInfo {
  string table_id = 1;
  string table_code = 2;
  string area_id = 3;
  string area_name = 4;
}

message PaymentSubmissionPage {
  repeated PaymentSubmissionInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  optional string total_amount = 5;
  string known_total_amount = 6;
  int32 unbilled_count = 7;
  string cash_shift_id = 8;
}

service BillCheckoutGrpc {
  rpc Request(BillCheckoutRequest) returns (BillCheckoutInfo);
  rpc GetCurrent(BillCheckoutRequest) returns (BillCheckoutInfo);
  rpc Synchronize(BillCheckoutRequest) returns (BillCheckoutInfo);
  rpc Prepare(BillCheckoutRequest) returns (PreparedBillInfo);
  rpc GetPrepared(BillCheckoutRequest) returns (PreparedBillInfo);
  rpc Present(BillCheckoutRequest) returns (PreparedBillInfo);
  rpc Cancel(BillCheckoutRequest) returns (BillCheckoutInfo);
  rpc AuthorizeRelease(BillCheckoutRequest) returns (google.protobuf.Empty);
}
message BillCheckoutRequest {
  string table_session_id = 1;
  string checkout_id = 2;
  string guest_token = 3;
}
message PreparedBillInfo {
  string checkout_id = 1;
  string table_session_id = 2;
  string checkout_status = 3;
  BillInfo bill = 4;
  string prepared_by_ref = 5;
  string prepared_at = 6;
  optional string presented_at = 7;
}

message BillCheckoutInfo {
  string checkout_id = 1;
  string table_session_id = 2;
  optional string bill_id = 3;
  string status = 4;
  optional string source_hash = 5;
  bool ordering_reopened = 6;
}

service TaxFeePolicyGrpc {
  rpc Create(CreateTaxFeePolicyRequest) returns (TaxFeePolicyInfo);
  rpc GetAll(TaxFeePolicyListRequest) returns (TaxFeePolicyPage);
  rpc GetById(TaxFeePolicyIdRequest) returns (TaxFeePolicyInfo);
}

message CreateTaxFeePolicyRequest {
  optional string vat_rate = 1;
  optional string service_rate = 2;
  optional bool service_enabled = 3;
  optional string effective_from = 4;
}

message TaxFeePolicyIdRequest { string tax_fee_policy_id = 1; }
message TaxFeePolicyListRequest { int32 page = 1; int32 page_size = 2; }
message TaxFeePolicyInfo {
  string tax_fee_policy_id = 1;
  int32 version = 2;
  string vat_rate = 3;
  string service_rate = 4;
  bool service_enabled = 5;
  string effective_from = 6;
}

message TaxFeePolicyPage {
  repeated TaxFeePolicyInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service CashRegisterGrpc {
  rpc Create(CreateCashRegisterRequest) returns (CashRegisterInfo);
  rpc GetAll(CashRegisterListRequest) returns (CashRegisterPage);
  rpc GetById(CashRegisterIdRequest) returns (CashRegisterInfo);
}

service CashShiftGrpc {
  rpc Open(OpenCashShiftRequest) returns (CashShiftInfo);
  rpc OpenDefault(OpenDefaultCashShiftRequest) returns (CashShiftInfo);
  rpc GetCurrent(CashShiftRegisterRequest) returns (CashShiftInfo);
}

message CashShiftRegisterRequest {
  string cash_register_id = 1;
}

message OpenDefaultCashShiftRequest {
  string restaurant_id = 1;
  optional string opening_cash = 2;
}

message OpenCashShiftRequest {
  string cash_register_id = 1;
  optional string opening_cash = 2;
}

message CashShiftInfo {
  string cash_shift_id = 1;
  string cash_register_id = 2;
  string restaurant_id = 3;
  string cashier_user_ref = 4;
  string opening_cash = 5;
  string opened_at = 6;
  string status = 7;
}

message CreateCashRegisterRequest {
  string restaurant_id = 1;
  string code = 2;
}

message CashRegisterListRequest {
  optional string restaurant_id = 1;
  optional string search = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CashRegisterIdRequest {
  string cash_register_id = 1;
}

message CashRegisterInfo {
  string cash_register_id = 1;
  string restaurant_id = 2;
  string code = 3;
}

message CashRegisterPage {
  repeated CashRegisterInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service BillGrpc {
  rpc Create(CreateBillRequest) returns (BillInfo);
  rpc Refresh(BillIdRequest) returns (BillInfo);
  rpc GetAll(BillListRequest) returns (BillPage);
  rpc GetById(BillIdRequest) returns (BillInfo);
  rpc ApplyVoucher(ApplyVoucherRequest) returns (BillInfo);
  rpc RemoveVoucher(RemoveVoucherRequest) returns (BillInfo);
  rpc GetAvailablePromotions(BillIdRequest) returns (ApplicablePromotionListReply);
  rpc AssignCustomer(AssignCustomerRequest) returns (BillInfo);
}
message CreateBillRequest { string table_session_id = 1; }
message BillIdRequest { string bill_id = 1; }
message AssignCustomerRequest { string bill_id = 1; string customer_id = 2; }
message BillListRequest {
  optional string restaurant_id = 1;
  optional string search = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message BillInfo {
  string bill_id = 1;
  string restaurant_id = 2;
  string bill_number = 3;
  string status = 4;
  string currency = 5;
  string sub_total = 6;
  string discount_amount = 7;
  string vat_rate_snapshot = 8;
  string service_rate_snapshot = 9;
  string vat_amount = 10;
  string service_amount = 11;
  string total_amount = 12;
  string rounding_adjustment = 13;
  string version = 14;
  bool has_complete_cogs = 15;
  string source_status = 16;
  repeated string warnings = 17;
  repeated BillLineInfo items = 18;
  repeated BillAdjustmentInfo adjustments = 19;
  optional string customer_ref = 20;
}
message BillLineInfo {
  string bill_line_id = 1;
  string order_item_ref = 2;
  string table_session_ref = 3;
  string original_table_ref = 4;
  optional string combo_group_ref = 5;
  string item_snapshot_json = 6;
  string quantity = 7;
  string unit_price_snapshot = 8;
  optional string cogs_snapshot = 9;
  string line_total = 10;
}
message BillPage {
  repeated BillInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service CashMovementGrpc {
  rpc Create(CreateCashMovementRequest) returns (CashMovementReply);
  rpc GetAll(CashLedgerRequest) returns (CashLedgerInfo);
  rpc GetById(CashMovementIdRequest) returns (CashMovementInfo);
}
message CreateCashMovementRequest {
  string cash_shift_id = 1;
  string idempotency_key = 2;
  string type = 3;
  optional string amount = 4;
  string reason = 5;
}
message CashMovementIdRequest { string cash_movement_id = 1; }
message CashLedgerRequest {
  string cash_shift_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message CashMovementReply {
  CashMovementInfo movement = 1;
  bool created = 2;
}
message CashMovementInfo {
  string cash_movement_id = 1;
  string cash_shift_id = 2;
  string restaurant_id = 3;
  optional string payment_id = 4;
  string type = 5;
  string signed_amount = 6;
  optional string reason = 7;
  string posted_at = 8;
  optional string performed_by_ref = 9;
  string performer_source = 10;
}
message CashLedgerInfo {
  string cash_shift_id = 1;
  string restaurant_id = 2;
  string currency = 3;
  string opening_cash = 4;
  string movement_total = 5;
  string expected_cash = 6;
  repeated CashMovementInfo items = 7;
  int32 total_count = 8;
  int32 page = 9;
  int32 page_size = 10;
}

service ShiftReportGrpc {
  rpc Preview(ShiftReportShiftRequest) returns (ShiftReconciliationInfo);
  rpc Close(CloseCashShiftRequest) returns (CloseCashShiftReply);
  rpc GetById(ShiftReportIdRequest) returns (ShiftReportInfo);
  rpc GetForShift(ShiftReportShiftRequest) returns (ShiftReportInfo);
  rpc GetAll(ShiftReportListRequest) returns (ShiftReportPage);
}
message ShiftReportShiftRequest { string cash_shift_id = 1; }
message ShiftReportIdRequest { string shift_report_id = 1; }
message CloseCashShiftRequest {
  string cash_shift_id = 1;
  optional string actual_cash = 2;
  optional string cash_handle_over = 3;
  string difference_reason = 4;
}
message CloseCashShiftReply { ShiftReportInfo report = 1; bool created = 2; }
message ShiftReportListRequest {
  optional string restaurant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message ShiftReportPage {
  repeated ShiftReportInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message ShiftReportInfo {
  string shift_report_id = 1;
  string cash_shift_id = 2;
  string cash_register_id = 3;
  string restaurant_id = 4;
  string cashier_user_ref = 5;
  string performer_source = 6;
  string expected_cash = 7;
  string actual_cash = 8;
  string cash_handle_over = 9;
  string difference = 10;
  string remaining_cash = 11;
  optional string difference_reason = 12;
  string closed_at = 13;
}
message ReconciliationBlockerInfo {
  string code = 1;
  optional string payment_id = 2;
  optional string cash_movement_id = 3;
  string message = 4;
}
message ShiftReconciliationInfo {
  string cash_shift_id = 1;
  string restaurant_id = 2;
  string status = 3;
  string opening_cash = 4;
  string movement_total = 5;
  string expected_cash = 6;
  string sale_total = 7;
  string cash_in_total = 8;
  string cash_out_total = 9;
  int32 payment_count = 10;
  bool can_close = 11;
  repeated ReconciliationBlockerInfo blockers = 12;
  string bank_transfer_total = 13;
}

service PayOsPaymentGrpc {
  rpc GetForCheckout(WaiterPayOsRequest) returns (WaiterPayOsPage);
  rpc GetForWaiter(WaiterPayOsRequest) returns (WaiterPayOsInfo);
  rpc Create(CreatePayOsPaymentRequest) returns (PayOsPaymentReply);
  rpc GetById(PaymentIdRequest) returns (PayOsPaymentInfo);
  rpc Reconcile(PaymentIdRequest) returns (PayOsPaymentInfo);
  rpc Cancel(PaymentIdRequest) returns (PayOsPaymentInfo);
}
service PaymentWebhookGrpc {
  rpc Process(PaymentWebhookRequest) returns (PaymentWebhookReply);
}
message CreatePayOsPaymentRequest {
  string bill_id = 1;
  string checkout_id = 2;
  string cash_shift_id = 3;
  string idempotency_key = 4;
}
message PayOsPaymentReply { PayOsPaymentInfo payment = 1; bool created = 2; }
message PaymentWebhookRequest { string payload = 1; string restaurant_id = 2; }
message PaymentWebhookReply { bool received = 1; }
message PayOsPaymentInfo {
  string payment_id = 1;
  string bill_id = 2;
  string cash_shift_id = 3;
  string restaurant_id = 4;
  string status = 5;
  string amount = 6;
  optional string provider_order_code = 7;
  optional string provider_payment_link_id = 8;
  optional string checkout_url = 9;
  optional string qr_code = 10;
  optional string provider_transaction_id = 11;
  optional string expires_at = 12;
  optional string paid_at = 13;
  optional int64 provider_amount_paid = 14;
  optional int64 provider_amount_remaining = 15;
  bool is_verified_zero = 16;
  bool requires_review = 17;
  bool link_details_available = 18;
}

// Server-to-server only. Never expose amount/customer/action as a public payment API.
service OnlinePaymentGrpc { rpc Execute(OnlinePaymentRequest) returns (OnlinePaymentReply); }
message OnlinePaymentRequest {
  string order_id = 1; string restaurant_id = 2; string customer_user_id = 3;
  string amount = 4; string action = 5; string reason = 6; string reference = 7; string evidence = 8;
}
message OnlinePaymentReply {
  string status = 1; string checkout_url = 2; string amount = 3;
  string paid_at = 4; string refunded_at = 5; string refund_reference = 6;
}

service PaymentProviderConfigGrpc {
  rpc GetById(PayOsConfigurationRequest) returns (PayOsConfigurationInfo);
  rpc Update(SavePayOsConfigurationRequest) returns (PayOsConfigurationInfo);
  rpc TestQr(TestPayOsConfigurationRequest) returns (PayOsTestQrInfo);
}
message TestPayOsConfigurationRequest {
  string restaurant_id = 1;
  string client_id = 2;
  string api_key = 3;
  string checksum_key = 4;
  bool use_saved_configuration = 5;
}
message PayOsTestQrInfo {
  int64 order_code = 1;
  int64 amount = 2;
  string description = 3;
  string qr_code = 4;
  string checkout_url = 5;
  string payment_link_id = 6;
  string status = 7;
  string account_name = 8;
  string account_number = 9;
  string bin = 10;
}
message PayOsConfigurationRequest { string restaurant_id = 1; }
message SavePayOsConfigurationRequest {
  string restaurant_id = 1;
  string client_id = 2;
  string api_key = 3;
  string checksum_key = 4;
  string return_url = 5;
  string cancel_url = 6;
  bool enabled = 7;
}
message PayOsConfigurationInfo {
  string restaurant_id = 1;
  bool configured = 2;
  string client_id = 3;
  string return_url = 4;
  string cancel_url = 5;
  string webhook_url = 6;
  bool enabled = 7;
}

service CashHandoverGrpc {
  rpc Create(CreateCashHandoverRequest) returns (CashHandoverReply);
  rpc GetById(PaymentIdRequest) returns (CashHandoverInfo);
  rpc GetAll(CashHandoverListRequest) returns (CashHandoverPage);
  rpc Confirm(ConfirmCashHandoverRequest) returns (CashHandoverInfo);
}
message CreateCashHandoverRequest {
  string bill_id = 1;
  string checkout_id = 2;
  optional string cash_received = 3;
  string idempotency_key = 4;
}
message ConfirmCashHandoverRequest {
  string payment_id = 1;
  optional string confirmed_amount = 2;
}
message CashHandoverListRequest {
  string cash_register_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message CashHandoverInfo {
  string payment_id = 1;
  string bill_id = 2;
  string restaurant_id = 3;
  string cash_register_id = 4;
  string cash_shift_id = 5;
  string waiter_user_ref = 6;
  optional string cashier_user_ref = 7;
  string amount = 8;
  string cash_received = 9;
  string change_amount = 10;
  optional string confirmed_amount = 11;
  string status = 12;
  string payment_status = 13;
  string collected_at = 14;
  optional string confirmed_at = 15;
}
message CashHandoverReply { CashHandoverInfo handover = 1; bool created = 2; }
message CashHandoverPage {
  repeated CashHandoverInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message WaiterPayOsRequest {
  string table_session_id = 1;
  string checkout_id = 2;
  string payment_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}
message WaiterPayOsInfo {
  string payment_id = 1;
  string bill_id = 2;
  string table_session_id = 3;
  string checkout_id = 4;
  string status = 5;
  string bill_status = 6;
  string amount = 7;
  optional string checkout_url = 8;
  optional string qr_code = 9;
  optional string expires_at = 10;
  optional string paid_at = 11;
  bool can_present_qr = 12;
  bool payment_confirmed = 13;
  bool requires_review = 14;
  string evaluated_at = 15;
}
message WaiterPayOsPage {
  repeated WaiterPayOsInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service TableTransferBillingGrpc {
  rpc Check(TableTransferBillingRequest) returns (TableTransferBillingReply);
}
message TableTransferBillingRequest { string source_session_id = 1; string target_session_id = 2; }
message TableTransferBillingReply { bool allowed = 1; }

message ApplyVoucherRequest {
  string bill_id = 1;
  string voucher_code = 2;
}

message RemoveVoucherRequest {
  string bill_id = 1;
  string voucher_id = 2;
}

message BillAdjustmentInfo {
  string bill_adjustment_id = 1;
  string bill_id = 2;
  optional string voucher_id = 3;
  optional string promotion_id = 4;
  string type = 5;
  string amount = 6;
  string rule_snapshot = 7;
  optional string actor_user_ref = 8;
  optional string reason = 9;
}

message ApplicablePromotionInfo {
  string promotion_id = 1;
  string promotion_name = 2;
  string discount_type = 3;
  string type = 4;
  string discount_value = 5;
  string estimated_discount = 6;
  string description = 7;
}

message ApplicablePromotionListReply {
  repeated ApplicablePromotionInfo items = 1;
}

service PromotionGrpc {
  rpc Create(CreatePromotionRequest) returns (PromotionInfo);
  rpc Update(UpdatePromotionRequest) returns (PromotionInfo);
  rpc GetAll(PromotionListRequest) returns (PromotionPage);
  rpc GetById(PromotionIdRequest) returns (PromotionInfo);
  rpc SetStatus(SetPromotionStatusRequest) returns (PromotionInfo);
}

message PromotionTargetInfo {
  string promotion_target_id = 1;
  string promotion_id = 2;
  optional string item_ref = 3;
  optional string category_ref = 4;
  string role = 5;
  string required_quantity = 6;
}

message PromotionInfo {
  string promotion_id = 1;
  string promotion_name = 2;
  string discount_type = 3;
  string type = 4;
  string discount_value = 5;
  optional int32 usage_limit = 6;
  int32 current_usage = 7;
  optional string minimum_spend = 8;
  string start_at = 9;
  optional string end_at = 10;
  bool is_active = 11;
  repeated PromotionTargetInfo targets = 12;
}

message CreatePromotionTargetInfo {
  optional string item_ref = 1;
  optional string category_ref = 2;
  string role = 3;
  string required_quantity = 4;
}

message CreatePromotionRequest {
  string promotion_name = 1;
  string discount_type = 2;
  string type = 3;
  string discount_value = 4;
  optional int32 usage_limit = 5;
  optional string minimum_spend = 6;
  string start_at = 7;
  optional string end_at = 8;
  bool is_active = 9;
  repeated CreatePromotionTargetInfo targets = 10;
}

message UpdatePromotionRequest {
  string promotion_id = 1;
  optional string promotion_name = 2;
  optional string discount_type = 3;
  optional string type = 4;
  optional string discount_value = 5;
  optional int32 usage_limit = 6;
  optional string minimum_spend = 7;
  optional string start_at = 8;
  optional string end_at = 9;
  optional bool is_active = 10;
}

message PromotionListRequest {
  optional string search = 1;
  optional bool is_active = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message PromotionIdRequest {
  string promotion_id = 1;
}

message SetPromotionStatusRequest {
  string promotion_id = 1;
  bool is_active = 2;
}

message PromotionPage {
  repeated PromotionInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service VoucherGrpc {
  rpc Create(CreateVoucherRequest) returns (VoucherInfo);
  rpc Update(UpdateVoucherRequest) returns (VoucherInfo);
  rpc GetAll(VoucherListRequest) returns (VoucherPage);
  rpc GetById(VoucherIdRequest) returns (VoucherInfo);
  rpc SetStatus(SetVoucherStatusRequest) returns (VoucherInfo);
}

message VoucherInfo {
  string voucher_id = 1;
  string normalized_voucher_code = 2;
  string discount_type = 3;
  string discount_value = 4;
  optional string maximum_discount = 5;
  optional int32 usage_limit = 6;
  int32 current_usage = 7;
  string start_at = 8;
  optional string end_at = 9;
  bool is_active = 10;
}

message CreateVoucherRequest {
  string voucher_code = 1;
  string discount_type = 2;
  string discount_value = 3;
  optional string maximum_discount = 4;
  optional int32 usage_limit = 5;
  string start_at = 6;
  optional string end_at = 7;
  bool is_active = 8;
}

message UpdateVoucherRequest {
  string voucher_id = 1;
  optional string discount_type = 2;
  optional string discount_value = 3;
  optional string maximum_discount = 4;
  optional int32 usage_limit = 5;
  optional string start_at = 6;
  optional string end_at = 7;
  optional bool is_active = 8;
}

message VoucherListRequest {
  optional string search = 1;
  optional bool is_active = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message VoucherIdRequest {
  string voucher_id = 1;
}

message SetVoucherStatusRequest {
  string voucher_id = 1;
  bool is_active = 2;
}

message VoucherPage {
  repeated VoucherInfo items = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

service RestaurantReportGrpc {
  rpc GetDishes(DishReportRequest) returns (DishReportReply);
  rpc GetSales(ReportPeriodRequest) returns (RestaurantSalesReportReply);
  rpc GetPeriod(ReportPeriodRequest) returns (ReportPeriodReply);
}
message ReportPeriodRequest {
  string restaurant_id = 1;
  string from = 2;
  string to = 3;
  string group_by = 4;
  string channel = 5;
  string method_code = 6;
  string shift = 7;
}
message ReportPeriodReply {
  string restaurant_id = 1;
  string time_zone = 2;
  string from_utc = 3;
  string to_utc = 4;
  string from_local = 5;
  string to_local = 6;
  string group_by = 7;
  string week_starts_on = 8;
}

message ReportAmountInfo { string known_amount = 1; optional string amount = 2; }
message ReportCountInfo { int32 known_count = 1; optional int32 count = 2; }
message ReportWarningInfo { string code = 1; string message = 2; }
message SalesReportTotalsInfo {
  ReportAmountInfo collections = 1;
  ReportAmountInfo refunds = 2;
  ReportAmountInfo net_collections = 3;
  ReportAmountInfo dish_revenue = 4;
  ReportAmountInfo net_dish_revenue = 5;
  ReportAmountInfo discounts = 6;
  ReportAmountInfo vat = 7;
  ReportAmountInfo service_fees = 8;
  ReportCountInfo paid_orders = 9;
  ReportAmountInfo rounding_adjustment = 10;
}
message SalesReportGroupInfo { string key = 1; SalesReportTotalsInfo totals = 2; }
message RestaurantSalesReportReply {
  ReportPeriodReply period = 1;
  string currency = 2;
  SalesReportTotalsInfo totals = 3;
  repeated SalesReportGroupInfo groups = 4;
  repeated ReportWarningInfo warnings = 5;
  repeated SalesReportGroupInfo channels = 6;
  repeated SalesReportGroupInfo methods = 7;
  repeated SalesReportGroupInfo shifts = 8;
  SalesReportFiltersInfo filters = 9;
}

message SalesReportFiltersInfo {
  string channel = 1;
  string method_code = 2;
  string shift = 3;
}

message DishReportRequest {
  ReportPeriodRequest query = 1;
  optional string item_id = 2;
  string restaurant_id = 3;
}
message DishReportOptionInfo {
  string option_id = 1;
  string name = 2;
  int32 quantity = 3;
  string extra_price = 4;
}
message DishReportPriceInfo {
  string unit_price = 1;
  repeated DishReportOptionInfo options = 2;
}
message DishReportItemInfo {
  string item_id = 1;
  repeated string names = 2;
  string known_quantity = 3;
  optional string quantity = 4;
  ReportAmountInfo gross_sales = 5;
  ReportAmountInfo net_sales = 6;
  ReportAmountInfo cost = 7;
  ReportAmountInfo gross_profit = 8;
  repeated DishReportPriceInfo prices = 9;
  ReportAmountInfo discounts = 10;
  optional string contribution_margin_percent = 11;
}
message DishReportReply {
  ReportPeriodReply period = 1;
  SalesReportFiltersInfo filters = 2;
  optional string item_id = 3;
  bool quantity_complete = 4;
  repeated DishReportItemInfo items = 5;
  repeated ReportWarningInfo warnings = 6;
  string currency = 7;
}

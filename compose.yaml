name: backend
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend
  db-init:
    build:
      context: docker/sql
    environment:
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: 'no'
    networks:
      - backend
  identity:
    image: backend-identity:local
    build:
      context: .
      dockerfile: Services/identity_service/Identity.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-backend-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-backend-clients}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
  gateway:
    image: backend-gateway:local
    build:
      context: .
      dockerfile: Services/api_gateway/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      GrpcServices__Identity: http://identity:5001
      GrpcServices__Catalog: http://catalog:5003
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-5000}:5000"
    depends_on:
      - identity
      - restaurant
      - catalog
      - ordering
    restart: unless-stopped
    networks:
      - backend
  restaurant:
    image: backend-restaurant:local
    build:
      context: .
      dockerfile: Services/restaurant_service/Restaurant.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RestaurantDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Qr__MenuBaseUrl: ${QR_MENU_BASE_URL:-http://localhost:5173/menu}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
  catalog:
    image: backend-catalog:local
    build:
      context: .
      dockerfile: Services/catalog_service/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      GrpcServices__Identity: http://identity:5001
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      CatalogManagement__MenuManagerRoleIds__0: ${CATALOG_MENU_MANAGER_ROLE_ID:-manager}
      CatalogManagement__KitchenRoleIds__0: ${CATALOG_KITCHEN_ROLE_ID:-kitchen}
      CatalogManagement__MenuReaderRoleIds__0: ${CATALOG_MENU_READER_ROLE_ID:-waiter}
      CatalogManagement__NonSellingItemAvailabilities__0: ${CATALOG_NON_SELLING_AVAILABILITY:-Inactive}
      ItemManagement__InitialAvailability: ${CATALOG_INITIAL_AVAILABILITY:-Inactive}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
  ordering:
    image: backend-ordering:local
    build:
      context: .
      dockerfile: Services/ordering_service/Ordering.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderingDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
  customer:
    image: backend-customer:local
    build:
      context: .
      dockerfile: Services/customer_service/Customer.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CustomerDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
  inventory:
    image: backend-inventory:local
    build:
      context: .
      dockerfile: Services/inventory_service/Inventory.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
  billing:
    image: backend-billing:local
    build:
      context: .
      dockerfile: Services/billing_service/Billing.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BillingDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
volumes:
  sql-data:
networks:
  backend:
    driver: bridge

name: backend
services:
  identity:
    image: backend-identity:local
    build:
      context: .
      dockerfile: Services/identity_service/Identity.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${IDENTITY_DB_CONNECTION:?Set IDENTITY_DB_CONNECTION in .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-backend-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-backend-clients}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
  gateway:
    image: backend-gateway:local
    build:
      context: .
      dockerfile: Services/api_gateway/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      GrpcServices__Identity: http://identity:5001
      GrpcServices__Catalog: http://catalog:5003
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-5000}:5000"
    depends_on:
      - identity
    networks:
      - backend
  restaurant:
    profiles: [services]
    image: backend-restaurant:local
    build:
      context: .
      dockerfile: Services/restaurant_service/Restaurant.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${RESTAURANT_DB_CONNECTION:-}
      Qr__MenuBaseUrl: ${QR_MENU_BASE_URL:-http://localhost:5173/menu}
      Qr__ImageDirectory: /app/App_Data/qr-images
    volumes:
      - qr-images:/app/App_Data/qr-images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
  catalog:
    profiles: [services]
    image: backend-catalog:local
    build:
      context: .
      dockerfile: Services/catalog_service/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${CATALOG_DB_CONNECTION:-}
      GrpcServices__Identity: http://identity:5001
      CatalogManagement__MenuManagerRoleIds__0: ${CATALOG_MENU_MANAGER_ROLE_ID:-}
      CatalogManagement__NonSellingItemAvailabilities__0: ${CATALOG_NON_SELLING_AVAILABILITY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
  ordering:
    profiles: [services]
    image: backend-ordering:local
    build:
      context: .
      dockerfile: Services/ordering_service/Ordering.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${ORDERING_DB_CONNECTION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
  customer:
    profiles: [services]
    image: backend-customer:local
    build:
      context: .
      dockerfile: Services/customer_service/Customer.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${CUSTOMER_DB_CONNECTION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
  inventory:
    profiles: [services]
    image: backend-inventory:local
    build:
      context: .
      dockerfile: Services/inventory_service/Inventory.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${INVENTORY_DB_CONNECTION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
  billing:
    profiles: [services]
    image: backend-billing:local
    build:
      context: .
      dockerfile: Services/billing_service/Billing.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${BILLING_DB_CONNECTION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
volumes:
  qr-images:
networks:
  backend:
    driver: bridge
